name: Validar aplicação

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar tipos
        run: npm run typecheck

      - name: Validar lint
        run: npm run lint

      - name: Gerar build de produção
        run: npm run build
